services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pasaorder
      POSTGRES_PASSWORD: pasaorder
      POSTGRES_DB: pasaorder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasaorder -d pasaorder"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
